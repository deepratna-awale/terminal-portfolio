name: CI

# Runs on pull_request (never pull_request_target), so pull requests from forks
# get a read-only token and no secrets.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Check server syntax
        run: for file in server/*.mjs; do node --check "$file"; done
      - name: Smoke test the production server
        run: |
          PORT=8787 node server/index.mjs &
          for i in $(seq 1 20); do curl -fsS localhost:8787/health && break; sleep 0.5; done
          curl -fsS localhost:8787/health
          curl -fsS localhost:8787/ | grep -q '<div id="root">'

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
      - run: terraform fmt -check -recursive
        working-directory: terraform
      - run: terraform init -backend=false && terraform validate
        working-directory: terraform
