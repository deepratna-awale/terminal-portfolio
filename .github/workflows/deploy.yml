name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

# Account-specific values come from repository variables (Settings, Secrets and
# variables, Actions, Variables). See README, "Deploy your own".
env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AWS_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
  SERVICE_NAME: ${{ vars.SERVICE_NAME || 'terminal-portfolio' }}
  CONTAINER_NAME: portfolio

jobs:
  deploy:
    # Set the repository variable DEPLOY_ENABLED=true once the Terraform stack is applied.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Restrict this environment to the main branch in the repository settings;
    # the deploy role only trusts this environment and the main branch.
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push image
        id: image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
        run: |
          docker buildx build --platform linux/amd64 --push -t "$IMAGE" .
          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy to Lightsail
        id: deploy
        env:
          IMAGE: ${{ steps.image.outputs.uri }}
          GUESTBOOK_BUCKET: ${{ vars.GUESTBOOK_BUCKET }}
          GUESTBOOK_ACCESS_KEY_ID: ${{ secrets.GUESTBOOK_ACCESS_KEY_ID }}
          GUESTBOOK_SECRET_ACCESS_KEY: ${{ secrets.GUESTBOOK_SECRET_ACCESS_KEY }}
          # Bedrock API key of the one-model terminal-portfolio-bedrock-chat user.
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.BEDROCK_API_KEY }}
          BEDROCK_GUARDRAIL_ID: ${{ vars.BEDROCK_GUARDRAIL_ID }}
          BEDROCK_GUARDRAIL_VERSION: ${{ vars.BEDROCK_GUARDRAIL_VERSION }}
        run: |
          # Guestbook and Bedrock settings are only passed when they are configured.
          containers=$(jq -n --arg name "$CONTAINER_NAME" --arg image "$IMAGE" \
            '{($name): {image: $image, ports: {"8080": "HTTP"}, environment: ({PORT: "8080"} + ($ENV | with_entries(select(((.key | startswith("GUESTBOOK_")) or (.key | startswith("BEDROCK_")) or .key == "AWS_BEARER_TOKEN_BEDROCK") and .value != ""))))}}')
          version=$(aws lightsail create-container-service-deployment \
            --service-name "$SERVICE_NAME" \
            --containers "$containers" \
            --public-endpoint "{\"containerName\":\"$CONTAINER_NAME\",\"containerPort\":8080,\"healthCheck\":{\"path\":\"/health\",\"successCodes\":\"200\"}}" \
            --query 'containerService.nextDeployment.version' --output text)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment
        env:
          VERSION: ${{ steps.deploy.outputs.version }}
        run: |
          for i in $(seq 1 40); do
            state=$(aws lightsail get-container-service-deployments --service-name "$SERVICE_NAME" \
              --query "deployments[?version==\`$VERSION\`].state | [0]" --output text)
            echo "deployment $VERSION: $state"
            case "$state" in
              ACTIVE) exit 0 ;;
              FAILED) exit 1 ;;
            esac
            sleep 15
          done
          echo "Deployment $VERSION did not become ACTIVE in time" >&2
          exit 1
