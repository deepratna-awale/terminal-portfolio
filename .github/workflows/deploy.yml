name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::888577021874:role/terminal-portfolio-github-deploy
  SERVICE_NAME: terminal-portfolio
  CONTAINER_NAME: portfolio

jobs:
  deploy:
    # Set the repository variable DEPLOY_ENABLED=true once the Terraform stack is applied.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
        run: |
          docker buildx build --platform linux/amd64 --push -t "$IMAGE" .
          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy to Lightsail
        id: deploy
        env:
          IMAGE: ${{ steps.image.outputs.uri }}
        run: |
          version=$(aws lightsail create-container-service-deployment \
            --service-name "$SERVICE_NAME" \
            --containers "{\"$CONTAINER_NAME\":{\"image\":\"$IMAGE\",\"ports\":{\"80\":\"HTTP\"},\"environment\":{\"PORT\":\"80\"}}}" \
            --public-endpoint "{\"containerName\":\"$CONTAINER_NAME\",\"containerPort\":80,\"healthCheck\":{\"path\":\"/health\",\"successCodes\":\"200\"}}" \
            --query 'containerService.nextDeployment.version' --output text)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment
        env:
          VERSION: ${{ steps.deploy.outputs.version }}
        run: |
          for i in $(seq 1 40); do
            state=$(aws lightsail get-container-service-deployments --service-name "$SERVICE_NAME" \
              --query "deployments[?version==\`$VERSION\`].state | [0]" --output text)
            echo "deployment $VERSION: $state"
            case "$state" in
              ACTIVE) exit 0 ;;
              FAILED) exit 1 ;;
            esac
            sleep 15
          done
          echo "Deployment $VERSION did not become ACTIVE in time" >&2
          exit 1
